<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMFY — геловінські сюрпризи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #43b02a;
    --orange: #ff6b1a;
    --orange-dark: #e85a0c;
    --navy: #0b1630;
    --white: #fff;
    --text: #1b1b1b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { overflow-x: hidden; }

  body {
    min-height: 100vh;
    background: var(--green);
    font-family: "Roboto", Arial, sans-serif;
    color: var(--text);
    padding: 17px 16px 80px;
  }

  /* Колонка 600px, як у макеті */
  .column {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  .header { display: block; width: 100%; height: auto; }

  /* ---------- Листя навколо ---------- */
  .leaf {
    position: absolute;
    pointer-events: none;
    animation: sway 4s ease-in-out infinite alternate;
    z-index: 0;
  }
  .leaf img { width: 100%; display: block; }

  @media (max-width: 900px) { .leaf.far { display: none; } }

  /* ---------- Сцена з коробками ---------- */
  .scene {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    z-index: 1;
  }
  .scene-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
  }

  .box {
    position: absolute;
    width: 35.833%;          /* 215 / 600 */
    aspect-ratio: 1 / 1;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: dropIn .7s cubic-bezier(.3,1.5,.5,1) both;
  }
  .box[data-pos="1"] { left: 0;       top: 54%;     z-index: 2; animation-delay: .2s; }
  .box[data-pos="2"] { left: 30.833%; top: 64.167%; z-index: 3; animation-delay: .35s; }
  .box[data-pos="3"] { left: 64.167%; top: 54%;     z-index: 2; animation-delay: .5s; }

  .box img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
  }
  .box .open { opacity: 0; transform: scale(.2); }

  /* Тінь під першою коробкою (у її картинці тіні немає) */
  .box[data-pos="1"]::before {
    content: "";
    position: absolute;
    left: 17%; top: 79%;
    width: 69%; height: 14%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.35), transparent 70%);
    transition: opacity .4s;
  }
  .box[data-pos="1"].opened::before { opacity: 0; }

  .box:not(.opened):not(:disabled):hover .closed { animation: wiggle .6s ease-in-out infinite; }
  .box:focus-visible { outline: 3px solid var(--white); outline-offset: -6px; border-radius: 16px; }
  .box:disabled { cursor: default; }

  /* Трясемо перед відкриттям */
  .box.shaking .closed { animation: shake .5s ease-in-out; }

  /* Відкрита коробка */
  .box.opened { cursor: default; }
  .box.opened .closed { animation: burst .45s ease-in forwards; }
  .box.opened .open   { animation: popOut .7s .25s cubic-bezier(.2,1.6,.4,1) forwards; }
  .box.opened.prize .open { animation: popOut .7s .25s cubic-bezier(.2,1.6,.4,1) forwards, glow 1.6s 1s ease-in-out infinite alternate; }

  /* Спалах при відкритті */
  .box .flash {
    position: absolute;
    left: 50%; top: 50%;
    width: 30%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,220,120,.6) 40%, transparent 70%);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
  }
  .box.opened .flash { animation: flash .6s .2s ease-out; }

  /* Підказка "Спробуй ще" */
  .bubble {
    position: absolute;
    left: 50%;
    top: -6%;
    transform: translate(-50%, 10px) scale(.6);
    opacity: 0;
    background: var(--white);
    color: var(--navy);
    font-weight: 700;
    font-size: clamp(12px, 2.6vw, 15px);
    white-space: nowrap;
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    pointer-events: none;
    z-index: 5;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -6px;
    border: 7px solid transparent;
    border-bottom: 0;
    border-top-color: var(--white);
    transform: translateX(-50%);
  }
  .box.opened .bubble { animation: bubble 2.6s .7s ease forwards; }

  /* ---------- Текстова картка ---------- */
  .card {
    position: relative;
    z-index: 1;
    background: var(--white);
    border-radius: 8px;
    padding: 30px 40px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
  }

  /* ---------- Блок з промокодом ---------- */
  .result {
    display: none;
    position: relative;
    z-index: 1;
    grid-template-columns: 242px 1fr;   /* текст у макеті починається з x=242 */
    align-items: start;
    padding: 0 8px 0 0;
    color: var(--white);
  }
  .result.show { display: grid; animation: slideUp .8s cubic-bezier(.2,1.3,.4,1) both; }

  /* У макеті конячка висотою 324px і заходить на 8px під картку */
  .result .horse { width: 233px; max-width: 100%; height: auto; display: block; margin-top: -8px; }
  .result > div { padding-top: 25px; }
  .result.show .horse { animation: bounceIn 1s .3s cubic-bezier(.2,1.6,.4,1) both; }

  .result h2 {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: clamp(32px, 7vw, 50px);
    line-height: 1.05;
    letter-spacing: -.5px;
    margin-bottom: 10px;
  }
  .result p { font-size: 14px; line-height: 1.6; margin-bottom: 14px; max-width: 300px; }

  .promo {
    font: 700 26px "Roboto", Arial, sans-serif;
    letter-spacing: 1px;
    color: var(--white);
    background: var(--orange);
    border: none;
    border-radius: 6px;
    width: 208px;
    max-width: 100%;
    height: 65px;
    cursor: pointer;
    position: relative;
    transition: transform .15s, background .15s;
  }
  .promo:hover { background: var(--orange-dark); transform: translateY(-2px); }
  .promo:active { transform: translateY(0); }
  .promo .hint {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 6px);
    font: 500 12px "Roboto", Arial, sans-serif;
    letter-spacing: 0;
    color: var(--white);
    opacity: .85;
  }

  @media (max-width: 520px) {
    .card { padding: 22px 20px; font-size: 15px; }
    .result { grid-template-columns: 1fr; text-align: center; padding: 0; gap: 8px; }
    .result .horse { width: 55%; margin: 16px auto 0; }
    .result > div { padding-top: 0; }
    .result p { margin-left: auto; margin-right: auto; }
  }

  /* ---------- Листя, що падає після перемоги ---------- */
  .falling {
    position: fixed;
    top: -80px;
    pointer-events: none;
    z-index: 100;
    animation: fall linear forwards;
  }

  /* ---------- Keyframes ---------- */
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-40px) scale(.8); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-4deg); }
    75% { transform: rotate(4deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-4px, 0) rotate(-6deg); }
    40% { transform: translate(4px, -4px) rotate(6deg); }
    60% { transform: translate(-4px, -6px) rotate(-6deg) scale(1.05); }
    80% { transform: translate(4px, -2px) rotate(5deg) scale(1.08); }
  }
  @keyframes burst {
    0%   { transform: scale(1.08); opacity: 1; filter: brightness(1); }
    50%  { transform: scale(1.25, .85); opacity: 1; filter: brightness(1.6); }
    100% { transform: scale(1.5); opacity: 0; filter: brightness(2.5); }
  }
  @keyframes popOut {
    0%   { opacity: 0; transform: translateY(20%) scale(.2) rotate(-10deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 0 rgba(255,214,90,0)); }
    to   { filter: drop-shadow(0 0 18px rgba(255,214,90,.95)); }
  }
  @keyframes flash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(5); }
  }
  @keyframes bubble {
    0%   { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
    15%  { opacity: 1; transform: translate(-50%, -6px) scale(1.05); }
    25%  { transform: translate(-50%, 0) scale(1); }
    80%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -14px) scale(.9); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes bounceIn {
    from { opacity: 0; transform: translateY(30px) scale(.6); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes sway {
    from { transform: rotate(var(--r, 0deg)) translateY(0); }
    to   { transform: rotate(calc(var(--r, 0deg) + 12deg)) translateY(8px); }
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 115vh) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="column">
    <!-- Декоративне листя (координати з макету, відносно колонки 600px) -->
    <div class="leaf far" style="left:678px; top:648px; width:125px; --r:20deg"><img src="assets/leaf.png" alt=""></div>
    <div class="leaf far" style="left:939px; top:381px; width:84px; --r:-30deg; animation-delay:-1s"><img src="assets/leaf.png" alt=""></div>
    <div class="leaf far" style="left:-331px; top:702px; width:84px; --r:40deg; animation-delay:-2s"><img src="assets/leaf.png" alt=""></div>
    <div class="leaf far" style="left:-711px; top:564px; width:149px; --r:-10deg; animation-delay:-.5s"><img src="assets/leaf.png" alt=""></div>
    <div class="leaf far" style="left:748px; top:-73px; width:198px; --r:15deg; animation-delay:-3s"><img src="assets/leaf.png" alt=""></div>
    <div class="leaf far" style="left:-161px; top:262px; width:141px; --r:-20deg; animation-delay:-1.5s"><img src="assets/leaf.png" alt=""></div>

    <img class="header" src="assets/header.png" alt="COMFY: ноутбуки, комплектуючі, аксесуари" width="600" height="111">

    <div class="scene">
      <img class="scene-bg" src="assets/scene.png" alt="Геловінська конячка COMFY">
      <button class="box" type="button" data-pos="1" aria-label="Подарункова коробка 1"></button>
      <button class="box" type="button" data-pos="2" aria-label="Подарункова коробка 2"></button>
      <button class="box" type="button" data-pos="3" aria-label="Подарункова коробка 3"></button>
    </div>

    <div class="card">
      Конячка COMFY підготувала геловінські сюрпризи й заховала їх у подарункових коробках.
      Вибирайте одну, відкривайте і перевіряйте, що вам випало. Може, саме там чекає знижка,
      яку так давно хотілося.
    </div>

    <section class="result" id="result" aria-live="polite">
      <img class="horse" src="assets/horse_pumpkin.png" alt="" width="338" height="470">
      <div>
        <h2>Вітаємо, ви знайшли сюрприз!</h2>
        <p>А щоб скористатися магічними пропозиціями, введіть промокод</p>
        <button class="promo" id="promo" type="button" title="Натисніть, щоб скопіювати"></button>
      </div>
    </section>
  </div>

<script>
  // Промокод, який випадає у третій відкритій коробці
  const PROMO_CODE = "MAGIC";

  // Що лежить у порожніх коробках (1-ша і 2-га відкриті) та в призовій (3-тя відкрита)
  const EMPTY_IMAGES = ["assets/box_open_1.png", "assets/box_open_2.png"];
  const PRIZE_IMAGE = "assets/box_open_3.png";
  const EMPTY_TEXT = ["Порожньо! Спробуй ще 👻", "І тут привид! Спробуй ще 🎃"];

  const boxes = document.querySelectorAll(".box");
  const result = document.getElementById("result");
  const promoBtn = document.getElementById("promo");
  let openedCount = 0;
  let busy = false;

  // Попереднє завантаження картинок, щоб відкриття було без затримки
  [...EMPTY_IMAGES, PRIZE_IMAGE].forEach(src => { new Image().src = src; });

  boxes.forEach(box => {
    const n = box.dataset.pos;
    box.innerHTML = `
      <img class="closed" src="assets/box${n}.png" alt="">
      <img class="open" alt="">
      <span class="flash"></span>
      <span class="bubble"></span>`;
    box.addEventListener("click", () => openBox(box));
  });

  promoBtn.innerHTML = `${PROMO_CODE}<span class="hint">натисніть, щоб скопіювати</span>`;
  promoBtn.addEventListener("click", copyCode);

  function openBox(box) {
    if (busy || box.classList.contains("opened") || box.disabled) return;
    busy = true;
    openedCount++;
    const isPrize = openedCount === 3;
    const openImg = box.querySelector(".open");

    openImg.src = isPrize ? PRIZE_IMAGE : EMPTY_IMAGES[openedCount - 1];
    box.classList.add("shaking");

    setTimeout(() => {
      box.classList.remove("shaking");
      box.classList.add("opened");
      box.setAttribute("aria-disabled", "true");

      if (isPrize) {
        box.classList.add("prize");
        box.setAttribute("aria-label", "Промокод " + PROMO_CODE);
        boxes.forEach(b => { if (!b.classList.contains("opened")) b.disabled = true; });
        setTimeout(showResult, 700);
      } else {
        box.querySelector(".bubble").textContent = EMPTY_TEXT[openedCount - 1];
        box.setAttribute("aria-label", "Порожня коробка");
        busy = false;
      }
    }, 500);
  }

  function showResult() {
    result.classList.add("show");
    dropLeaves();
    setTimeout(() => result.scrollIntoView({ behavior: "smooth", block: "center" }), 300);
  }

  function copyCode() {
    const hint = promoBtn.querySelector(".hint");
    const done = () => {
      hint.textContent = "скопійовано ✓";
      setTimeout(() => (hint.textContent = "натисніть, щоб скопіювати"), 2000);
    };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = PROMO_CODE;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
      done();
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(PROMO_CODE).then(done, fallback);
    } else {
      fallback();
    }
  }

  // Святкове листя, що падає згори
  function dropLeaves() {
    for (let i = 0; i < 40; i++) {
      const leaf = document.createElement("img");
      leaf.src = "assets/leaf.png";
      leaf.alt = "";
      leaf.className = "falling";
      const size = 28 + Math.random() * 50;
      leaf.style.width = size + "px";
      leaf.style.left = Math.random() * 100 + "vw";
      leaf.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
      leaf.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      leaf.style.animationDuration = 3 + Math.random() * 3 + "s";
      leaf.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(leaf);
      leaf.addEventListener("animationend", () => leaf.remove());
    }
  }
</script>
</body>
</html>
