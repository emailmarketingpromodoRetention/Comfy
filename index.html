<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMFY — геловінські сюрпризи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0f;
    --menu: #00152b;
    --orange: #ff6b1a;
    --orange-dark: #e85a0c;
    --navy: #0b1630;
    --white: #fff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { overflow-x: hidden; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: "Roboto", Arial, sans-serif;
    color: var(--white);
    padding: 17px 16px 80px;
  }

  a { color: inherit; text-decoration: none; }

  /* Колонка 600px, як у макеті */
  .column {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  /* ---------- Шапка: логотип + меню ---------- */
  .logo {
    display: block;
    width: 172px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  .logo img { display: block; width: 100%; height: auto; }

  .menu {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 46px;
    margin-top: 25px;
    background: var(--menu);
    border-radius: 6px;
    padding: 0 20px;
  }
  .menu a {
    font-size: 18px;
    line-height: 1;
    padding: 6px 4px;
    transition: color .2s;
  }
  .menu a:hover { color: var(--orange); }

  /* ---------- Листя навколо ---------- */
  .leaf {
    position: absolute;
    pointer-events: none;
    animation: sway 4s ease-in-out infinite alternate;
    z-index: 0;
  }
  .leaf img { width: 100%; display: block; }

  @media (max-width: 900px) { .leaf.far { display: none; } }

  /* ---------- Сцена з коробками ---------- */
  .scene {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    z-index: 1;
  }
  .scene-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
  }

  .box {
    position: absolute;
    width: 35.833%;          /* 215 / 600 */
    aspect-ratio: 1 / 1;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: dropIn .7s cubic-bezier(.3,1.5,.5,1) both;
  }
  .box[data-pos="1"] { left: 0;       top: 54%;     z-index: 2; animation-delay: .2s; }
  .box[data-pos="2"] { left: 30.833%; top: 64.167%; z-index: 3; animation-delay: .35s; }
  .box[data-pos="3"] { left: 64.167%; top: 54%;     z-index: 2; animation-delay: .5s; }

  .box img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
  }
  .box .open { opacity: 0; transform: scale(.2); }

  /* Тінь під першою коробкою (у її картинці тіні немає) */
  .box[data-pos="1"]::before {
    content: "";
    position: absolute;
    left: 17%; top: 79%;
    width: 69%; height: 14%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.6), transparent 70%);
    transition: opacity .4s;
  }
  .box[data-pos="1"].opened::before { opacity: 0; }

  .box:not(.opened):not(:disabled):hover .closed { animation: wiggle .6s ease-in-out infinite; }
  .box:focus-visible { outline: 3px solid var(--orange); outline-offset: -6px; border-radius: 16px; }
  .box:disabled { cursor: default; }

  /* Трясемо перед відкриттям */
  .box.shaking .closed { animation: shake .5s ease-in-out; }

  /* Відкрита коробка */
  .box.opened { cursor: default; }
  .box.opened .closed { animation: burst .45s ease-in forwards; }
  .box.opened .open   { animation: popOut .7s .25s cubic-bezier(.2,1.6,.4,1) forwards; }
  .box.opened.prize .open { animation: popOut .7s .25s cubic-bezier(.2,1.6,.4,1) forwards, glow 1.6s 1s ease-in-out infinite alternate; }

  /* Спалах при відкритті */
  .box .flash {
    position: absolute;
    left: 50%; top: 50%;
    width: 30%; aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,180,90,.6) 40%, transparent 70%);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
  }
  .box.opened .flash { animation: flash .6s .2s ease-out; }

  /* Підказка "Спробуй ще" */
  .bubble {
    --x: -50%;
    position: absolute;
    left: 50%;
    top: -6%;
    transform: translate(var(--x), 10px) scale(.6);
    opacity: 0;
    background: var(--white);
    color: var(--navy);
    font-weight: 700;
    font-size: clamp(12px, 2.6vw, 15px);
    white-space: nowrap;
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    pointer-events: none;
    z-index: 5;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -6px;
    border: 7px solid transparent;
    border-bottom: 0;
    border-top-color: var(--white);
    transform: translateX(-50%);
  }
  .box.opened .bubble { animation: bubble 2.6s .7s ease forwards; }
  .box.prize .bubble { display: none; }   /* у призовій коробці немає підказки "Спробуй ще" */

  /* ---------- Текст під сценою ---------- */
  .card {
    position: relative;
    z-index: 1;
    padding: 30px 40px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
  }

  /* ---------- Блок з промокодом ---------- */
  .result {
    display: none;
    position: relative;
    z-index: 1;
    grid-template-columns: 242px 1fr;   /* текст у макеті починається з x=242 */
    align-items: start;
    padding: 0 8px 0 0;
  }
  .result.show { display: grid; animation: slideUp .8s cubic-bezier(.2,1.3,.4,1) both; }

  .result .horse { width: 233px; max-width: 100%; height: auto; display: block; margin-top: -8px; }
  .result > div { padding-top: 25px; }
  .result.show .horse { animation: bounceIn 1s .3s cubic-bezier(.2,1.6,.4,1) both; }

  .result h2 {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: clamp(32px, 7vw, 50px);
    line-height: 1.05;
    letter-spacing: -.5px;
    margin-bottom: 10px;
  }
  .result .title { display: block; width: 100%; max-width: 420px; height: auto; margin-bottom: 10px; }
  .result p { font-size: 14px; line-height: 1.6; margin-bottom: 14px; max-width: 300px; }

  .promo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: 700 26px "Roboto", Arial, sans-serif;
    letter-spacing: 1px;
    color: var(--white);
    background: var(--orange);
    border-radius: 6px;
    width: 208px;
    max-width: 100%;
    height: 65px;
    position: relative;
    transition: transform .15s, background .15s;
  }
  .promo:hover { background: var(--orange-dark); transform: translateY(-2px); }
  .promo:active { transform: translateY(0); }
  .promo .hint {
    position: absolute;
    left: -20px; right: -20px;
    top: calc(100% + 6px);
    font: 500 12px "Roboto", Arial, sans-serif;
    letter-spacing: 0;
    text-align: center;
    color: var(--white);
    opacity: .75;
  }

  /* ---------- Мобайл: більше простору, щоб анімації не перекривали текст ---------- */
  @media (max-width: 520px) {
    body { padding: 14px 20px 90px; }
    .logo { width: 140px; }
    .menu { margin-top: 18px; height: 42px; padding: 0 8px; }
    .menu a { font-size: 15px; }
    .scene { margin-top: 28px; }                 /* місце над коробками для підказок */
    .card { margin-top: 36px; padding: 0 4px; font-size: 15px; }  /* відступ від коробок, що вистрибують */
    .result { grid-template-columns: 1fr; text-align: center; padding: 0; gap: 8px; margin-top: 24px; }
    .result .horse { width: 55%; margin: 16px auto 0; }
    .result > div { padding-top: 0; }
    .result p { margin-left: auto; margin-right: auto; }
    /* Крайні підказки притискаємо до країв, щоб не обрізались */
    .box[data-pos="1"] .bubble { left: 0; --x: 0%; }
    .box[data-pos="3"] .bubble { left: auto; right: 0; --x: 0%; }
    .box[data-pos="1"] .bubble::after { left: 30%; }
    .box[data-pos="3"] .bubble::after { left: 70%; }
    .bubble { top: -18%; }
  }

  /* ---------- Листя, що падає після перемоги ---------- */
  .falling {
    position: fixed;
    top: -80px;
    pointer-events: none;
    z-index: 100;
    animation: fall linear forwards;
  }

  /* ---------- Keyframes ---------- */
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-40px) scale(.8); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-4deg); }
    75% { transform: rotate(4deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-4px, 0) rotate(-6deg); }
    40% { transform: translate(4px, -4px) rotate(6deg); }
    60% { transform: translate(-4px, -6px) rotate(-6deg) scale(1.05); }
    80% { transform: translate(4px, -2px) rotate(5deg) scale(1.08); }
  }
  @keyframes burst {
    0%   { transform: scale(1.08); opacity: 1; filter: brightness(1); }
    50%  { transform: scale(1.25, .85); opacity: 1; filter: brightness(1.6); }
    100% { transform: scale(1.5); opacity: 0; filter: brightness(2.5); }
  }
  @keyframes popOut {
    0%   { opacity: 0; transform: translateY(20%) scale(.2) rotate(-10deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 0 rgba(255,140,40,0)); }
    to   { filter: drop-shadow(0 0 22px rgba(255,140,40,.9)); }
  }
  @keyframes flash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(5); }
  }
  @keyframes bubble {
    0%   { opacity: 0; transform: translate(var(--x), 10px) scale(.6); }
    15%  { opacity: 1; transform: translate(var(--x), -6px) scale(1.05); }
    25%  { transform: translate(var(--x), 0) scale(1); }
    80%  { opacity: 1; transform: translate(var(--x), 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--x), -14px) scale(.9); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes bounceIn {
    from { opacity: 0; transform: translateY(30px) scale(.6); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes sway {
    from { transform: rotate(var(--r, 0deg)) translateY(0); }
    to   { transform: rotate(calc(var(--r, 0deg) + 12deg)) translateY(8px); }
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 115vh) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>

        <p>А щоб скористатися магічними пропозиціями, введіть промокод</p>
        <a class="promo" id="promo" data-link="https://comfy.ua/ua/sale-promo/" href="https://comfy.ua/ua/sale-promo/" target="_blank" rel="noopener"></a>

  </div>

<script>
  // Промокод, який випадає у третій відкритій коробці
  const PROMO_CODE = "MAGIC";

  // UTM-мітки для всіх посилань
  const UTM = {
    utm_source: "br_promo",
    utm_medium: "email",
    utm_campaign: "promo_halloween_281028_game"
  };

  // Що лежить у порожніх коробках (1-ша і 2-га відкриті) та в призовій (3-тя відкрита)
  const EMPTY_IMAGES = ["/box_open_1.png", "/box_open_2.png"];
  const PRIZE_IMAGE = "/box_open_3.png";
  const EMPTY_TEXT = ["Порожньо! Спробуй ще 👻", "І тут привид! Спробуй ще 🎃"];

  // Додаємо UTM до всіх посилань
  document.querySelectorAll("[data-link]").forEach(a => {
    const url = new URL(a.dataset.link);
    Object.entries(UTM).forEach(([k, v]) => url.searchParams.set(k, v));
    a.href = url.toString();
  });

  const boxes = document.querySelectorAll(".box");
  const result = document.getElementById("result");
  const promoBtn = document.getElementById("promo");
  let openedCount = 0;
  let busy = false;

  // Попереднє завантаження картинок, щоб відкриття було без затримки
  [...EMPTY_IMAGES, PRIZE_IMAGE].forEach(src => { new Image().src = src; });

  boxes.forEach(box => {
    const n = box.dataset.pos;
    box.innerHTML = `
      <img class="closed" src="/box${n}.png" alt="">
      <img class="open" alt="">
      <span class="flash"></span>
      <span class="bubble"></span>`;
    box.addEventListener("click", () => openBox(box));
  });

  // Кнопка MAGIC: копіює промокод і відкриває сторінку акції в новій вкладці
  promoBtn.innerHTML = `${PROMO_CODE}<span class="hint"></span>`;
  promoBtn.addEventListener("click", copyCode);

  function openBox(box) {
    if (busy || box.classList.contains("opened") || box.disabled) return;
    busy = true;
    openedCount++;
    const isPrize = openedCount === 3;
    const openImg = box.querySelector(".open");

    openImg.src = isPrize ? PRIZE_IMAGE : EMPTY_IMAGES[openedCount - 1];
    box.classList.add("shaking");

    setTimeout(() => {
      box.classList.remove("shaking");
      box.classList.add("opened");
      box.setAttribute("aria-disabled", "true");

      if (isPrize) {
        box.classList.add("prize");
        box.setAttribute("aria-label", "Промокод " + PROMO_CODE);
        boxes.forEach(b => { if (!b.classList.contains("opened")) b.disabled = true; });
        setTimeout(showResult, 700);
      } else {
        box.querySelector(".bubble").textContent = EMPTY_TEXT[openedCount - 1];
        box.setAttribute("aria-label", "Порожня коробка");
        busy = false;
      }
    }, 500);
  }

  function showResult() {
    result.classList.add("show");
    dropLeaves();
    setTimeout(() => result.scrollIntoView({ behavior: "smooth", block: "center" }), 300);
  }

  function copyCode() {
    const hint = promoBtn.querySelector(".hint");
    const done = () => {
      hint.textContent = "код скопійовано ✓";
      setTimeout(() => (hint.textContent = "натисніть, щоб скопіювати код і перейти до акцій"), 2500);
    };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = PROMO_CODE;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
      done();
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(PROMO_CODE).then(done, fallback);
    } else {
      fallback();
    }
    // перехід на сторінку акцій відбувається самим посиланням (target="_blank")
  }

  // Святкове листя, що падає згори
  function dropLeaves() {
    for (let i = 0; i < 40; i++) {
      const leaf = document.createElement("img");
      leaf.src = "/leaf.png";
      leaf.alt = "";
      leaf.className = "falling";
      const size = 28 + Math.random() * 50;
      leaf.style.width = size + "px";
      leaf.style.left = Math.random() * 100 + "vw";
      leaf.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
      leaf.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      leaf.style.animationDuration = 3 + Math.random() * 3 + "s";
      leaf.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(leaf);
      leaf.addEventListener("animationend", () => leaf.remove());
    }
  }
</script>
